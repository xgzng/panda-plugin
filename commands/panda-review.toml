description = "Review correctness, security, load, tests, complexity and unrelated changes"
prompt = "Read and follow this extension's skills/panda-review/SKILL.md for the target change: {{args}}. Read the diff and connected code; check correctness, safety, realistic load, tests, speed, unnecessary complexity and unrelated changes. Follow company/project rules and Surgical Changes. Number concrete findings, each with location, behavior, problem, smallest fix and consequence. Finish with verdict and what was not checked. Report only; do not change files or Panda mode."
