description = "Audit repository quality, safety, load, tests and complexity"
prompt = "Read and follow this extension's skills/panda-audit/SKILL.md for the target scope: {{args}}. Map entry points and data flow first. Check bugs, security, realistic load, required tests, speed and unnecessary complexity, under company/project rules. Search callers and tests before declaring code dead. Rank at most 20 concrete findings with location, problem, smallest fix and consequence. Finish with verdict and unchecked areas. Report only; do not change files or Panda mode."
